[project]
name = "api-gateway"
version = "0.1.0"
description = "NSU Project"
authors = [
    {name = "Andrew Ermolenko",email = "hoggadar@ya.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.133.0,<0.134.0)"
]

[tool.poetry]
packages = [{include = "api_gateway", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
